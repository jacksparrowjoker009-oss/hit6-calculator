<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Attendance Sheet</title>
  <style>
    :root {
      --primary: #1e293b;
      --border: #94a3b8;
      --bg: #f8fafc;
      --weekend-bg: #f1f5f9;
      --p-color: #166534;
      --a-color: #991b1b;
      --l-color: #854d0e;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); margin: 0; padding: 20px; color: #0f172a; }

    .paper-sheet {
      max-width: 1400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    /* Screen Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 6px;
    }
    .toolbar input, .toolbar button {
      padding: 7px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 13px;
    }
    .btn-action { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: 600; }
    .btn-action:hover { background: #0369a1; }
    .btn-print { background: #059669; color: white; border: none; cursor: pointer; font-weight: 600; margin-left: auto; }
    .btn-print:hover { background: #047857; }

    /* Printable Header */
    .sheet-header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .sheet-title { margin: 0; font-size: 20px; font-weight: 700; color: var(--primary); }
    .sheet-subtitle { font-size: 13px; color: #475569; }

    /* Attendance Grid */
    .table-wrapper { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid var(--border);
      text-align: center;
      padding: 4px 2px;
      height: 28px;
    }
    th { background: #f8fafc; font-weight: 600; }

    col.col-no { width: 34px; }
    col.col-name { width: 200px; }
    col.col-day { width: auto; }
    col.col-stat { width: 44px; }
    col.col-act { width: 30px; }

    .day-num { font-size: 11px; }
    .day-name { font-size: 8px; text-transform: uppercase; color: #64748b; }
    .weekend { background-color: var(--weekend-bg); }

    .name-input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 2px 4px;
      font-size: 11px;
      outline: none;
    }
    .name-input:focus { background: #e2e8f0; border-radius: 2px; }

    .status-cell {
      cursor: pointer;
      font-weight: 700;
      user-select: none;
      font-size: 11px;
    }
    .status-P { color: var(--p-color); background: #dcfce7; }
    .status-A { color: var(--a-color); background: #fee2e2; }
    .status-L { color: var(--l-color); background: #fef3c7; }

    /* Print View Setup */
    @media print {
      body { background: white; padding: 0; }
      .paper-sheet { border: none; padding: 0; max-width: 100%; }
      .toolbar, .col-act, .btn-del { display: none !important; }
      table { font-size: 9.5px; }
      th, td { height: 22px; padding: 2px 1px; border-color: #64748b; }
      .name-input { font-size: 9.5px; }
      .name-input::placeholder { color: transparent; }
      .status-P { background: transparent !important; color: #000; }
      .status-A { background: #f1f5f9 !important; color: #000; }
      .status-L { background: transparent !important; color: #000; }
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
    }
  </style>
</head>
<body>

<div class="paper-sheet">
  <!-- Toolbar Controls -->
  <div class="toolbar">
    <label><strong>Month:</strong> <input type="month" id="selectedMonth" value="2026-10" onchange="generateMonth()"></label>
    <label><strong>Class Name:</strong> <input type="text" id="courseInput" value="Online Batch Sessions" oninput="updateTitles()"></label>
    <button class="btn-action" onclick="addRow()">+ Add Participant</button>
    <button class="btn-print" onclick="window.print()">Print / Export PDF</button>
  </div>

  <!-- Sheet Header -->
  <div class="sheet-header">
    <div>
      <h1 class="sheet-title" id="displayCourse">Online Batch Sessions</h1>
      <span class="sheet-subtitle">Daily Attendance Sheet (Click cell to toggle status)</span>
    </div>
    <div style="text-align: right;">
      <strong id="displayPeriod" style="font-size: 15px;">October 2026</strong>
      <div class="sheet-subtitle">P = Present, A = Absent, L = Late</div>
    </div>
  </div>

  <!-- Attendance Table -->
  <div class="table-wrapper">
    <table id="attendanceGrid">
      <colgroup id="colGroup"></colgroup>
      <thead>
        <tr id="headRow"></tr>
      </thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
</div>

<script>
  let daysInMonth = 31;
  let year = 2026;
  let month = 9; // October (0-indexed)

  // Starts with just ONE participant
  let participants = [
    { name: "", days: [] }
  ];

  const cycle = { "": "P", "P": "A", "A": "L", "L": "" };
  const weekdays = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

  function generateMonth() {
    const picker = document.getElementById("selectedMonth").value.split("-");
    year = parseInt(picker[0], 10);
    month = parseInt(picker[1], 10) - 1;

    daysInMonth = new Date(year, month + 1, 0).getDate();

    // Ensure all participant records match the days in this month
    participants.forEach(p => {
      if (!p.days || p.days.length !== daysInMonth) {
        let newDays = Array(daysInMonth).fill("");
        if (p.days) {
          for (let i = 0; i < Math.min(p.days.length, daysInMonth); i++) {
            newDays[i] = p.days[i];
          }
        }
        p.days = newDays;
      }
    });

    renderGrid();
    updateTitles();
  }

  function renderGrid() {
    // 1. Column layout
    let colHtml = `<col class="col-no"><col class="col-name">`;
    for (let d = 1; d <= daysInMonth; d++) colHtml += `<col class="col-day">`;
    colHtml += `<col class="col-stat"><col class="col-stat"><col class="col-act">`;
    document.getElementById("colGroup").innerHTML = colHtml;

    // 2. Table Headers
    let headHtml = `<th>#</th><th style="text-align:left; padding-left:6px;">Participant Name</th>`;
    for (let d = 1; d <= daysInMonth; d++) {
      let dayOfWeek = weekdays[new Date(year, month, d).getDay()];
      let isWeekend = (dayOfWeek === 'Sa' || dayOfWeek === 'Su') ? 'weekend' : '';
      headHtml += `<th class="${isWeekend}">
        <div class="day-num">${d}</div>
        <div class="day-name">${dayOfWeek}</div>
      </th>`;
    }
    headHtml += `<th>Pres</th><th>%</th><th class="col-act"></th>`;
    document.getElementById("headRow").innerHTML = headHtml;

    // 3. Body Rows
    const tbody = document.getElementById("bodyRows");
    tbody.innerHTML = "";

    participants.forEach((p, rIdx) => {
      const tr = document.createElement("tr");

      let pCount = p.days.filter(v => v === "P").length;
      let totalMarked = p.days.filter(v => v !== "").length;
      let rate = totalMarked > 0 ? Math.round((pCount / totalMarked) * 100) : 0;

      let rowHtml = `<td>${rIdx + 1}</td>
        <td style="text-align: left; padding: 0 4px;">
          <input class="name-input" type="text" placeholder="Type participant name..." 
                 value="${escapeHtml(p.name)}" 
                 oninput="participants[${rIdx}].name = this.value">
        </td>`;

      for (let d = 0; d < daysInMonth; d++) {
        let dayOfWeek = weekdays[new Date(year, month, d + 1).getDay()];
        let isWeekend = (dayOfWeek === 'Sa' || dayOfWeek === 'Su') ? 'weekend' : '';
        let val = p.days[d] || "";
        let statusClass = val ? `status-${val}` : "";
        rowHtml += `<td class="status-cell ${isWeekend} ${statusClass}" onclick="toggleCell(${rIdx}, ${d})">${val}</td>`;
      }

      rowHtml += `<td><strong>${pCount}</strong></td>
                  <td>${rate}%</td>
                  <td class="col-act"><button class="btn-del" onclick="deleteRow(${rIdx})" title="Delete" style="color:#ef4444;border:none;background:none;cursor:pointer;font-weight:bold;">✕</button></td>`;

      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
    });
  }

  function toggleCell(row, day) {
    const current = participants[row].days[day] || "";
    participants[row].days[day] = cycle[current];
    renderGrid();
  }

  function addRow() {
    participants.push({ name: "", days: Array(daysInMonth).fill("") });
    renderGrid();
  }

  function deleteRow(idx) {
    if (participants.length <= 1) {
      // Clear instead of removing if it's the last row
      participants[0] = { name: "", days: Array(daysInMonth).fill("") };
    } else {
      participants.splice(idx, 1);
    }
    renderGrid();
  }

  function updateTitles() {
    document.getElementById("displayCourse").innerText = document.getElementById("courseInput").value || "Attendance Sheet";
    const dateObj = new Date(year, month);
    document.getElementById("displayPeriod").innerText = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
  }

  function escapeHtml(text) {
    return text.replace(/"/g, "&quot;");
  }

  // Initialize on load
  generateMonth();
</script>

</body>
</html>
