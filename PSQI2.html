<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pittsburgh Sleep Quality Index (PSQI) Calculator</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --good: #16a34a;
      --poor: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 780px; background: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08); }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    
    .section { border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; background: #fafafa; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #0f172a; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.75rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
    input[type="time"], input[type="number"], select {
      width: 100%; padding: 0.55rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: white;
    }

    .score-summary {
      background: white; border: 2px solid var(--border); border-radius: 10px;
      padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-top: 1.5rem; margin-bottom: 2rem;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
    }
    .score-badge { padding: 0.35rem 0.8rem; border-radius: 9999px; color: white; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }
    
    .button-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.6rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-print {
      background: #0f172a;
      color: white;
    }

    .btn-print:hover {
      background: #334155;
    }

    /* History Table */
    .history-section {
      margin-top: 2rem;
    }

    .history-section h3 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      color: #0f172a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      text-align: left;
      padding: 0.75rem 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
    }

    @media print {
      body { padding: 0; background: white; }
      .container { box-shadow: none; max-width: 100%; padding: 0; }
      .score-summary { box-shadow: none; border-color: #cbd5e1; }
      .button-group { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pittsburgh Sleep Quality Index (PSQI)</h1>
    <p class="subtitle">Standard 1-month clinical sleep evaluation and scoring algorithm.</p>

    <!-- Sleep Timing & Duration -->
    <div class="section">
      <h3>1. Sleep Timing & Duration</h3>
      <div class="grid-2">
        <div>
          <label>Usual Bedtime:</label>
          <input type="time" id="bedTime" value="23:00">
        </div>
        <div>
          <label>Usual Wake Time:</label>
          <input type="time" id="wakeTime" value="07:00">
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label>Actual Sleep Duration (Hours):</label>
          <input type="number" id="sleepHours" min="0" max="24" step="0.5" value="7.5">
        </div>
        <div>
          <label>Minutes to Fall Asleep:</label>
          <input type="number" id="latencyMin" min="0" max="240" step="5" value="15">
        </div>
      </div>
    </div>

    <!-- Core Qualitative Questions -->
    <div class="section">
      <h3>2. Quality & Interventions</h3>
      <div class="grid-2">
        <div>
          <label>Subjective Sleep Quality:</label>
          <select id="c1_rating">
            <option value="0">Very good (0)</option>
            <option value="1">Fairly good (1)</option>
            <option value="2">Fairly bad (2)</option>
            <option value="3">Very bad (3)</option>
          </select>
        </div>
        <div>
          <label>Sleep Medicine Usage:</label>
          <select id="c6_rating">
            <option value="0">Not during past month (0)</option>
            <option value="1">Less than once a week (1)</option>
            <option value="2">Once or twice a week (2)</option>
            <option value="3">Three or more times a week (3)</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label>Trouble Staying Awake (Daytime):</label>
          <select id="daytime1">
            <option value="0">Never (0)</option>
            <option value="1">Less than once a week (1)</option>
            <option value="2">Once or twice a week (2)</option>
            <option value="3">Three or more times a week (3)</option>
          </select>
        </div>
        <div>
          <label>Maintaining Enthusiasm to Get Things Done:</label>
          <select id="daytime2">
            <option value="0">No problem at all (0)</option>
            <option value="1">Only a very slight problem (1)</option>
            <option value="2">Somewhat of a problem (2)</option>
            <option value="3">A very big problem (3)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Results Summary Card -->
    <div class="score-summary">
      <div>
        <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">Global PSQI Score</div>
        <span style="font-size: 2rem; font-weight: 800;" id="globalScore">0</span><span style="color: var(--text-muted);"> / 21</span>
      </div>
      <span id="statusBadge" class="score-badge" style="background-color: var(--good);">Good Sleeper (Score ≤ 5)</span>
      <div class="button-group">
        <button class="btn-primary" id="logBtn">Log Session</button>
        <button class="btn-print" onclick="window.print()">Print / Save PDF</button>
      </div>
    </div>

    <!-- Session History Table -->
    <div class="history-section">
      <h3>Session History</h3>
      <table>
        <thead>
          <tr>
            <th>Session</th>
            <th>Score</th>
            <th>Interpretation</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr>
            <td colspan="3" style="color: var(--text-muted); text-align: center;">No sessions logged yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const bedTime = document.getElementById('bedTime');
    const wakeTime = document.getElementById('wakeTime');
    const sleepHours = document.getElementById('sleepHours');
    const latencyMin = document.getElementById('latencyMin');
    const c1_rating = document.getElementById('c1_rating');
    const c6_rating = document.getElementById('c6_rating');
    const daytime1 = document.getElementById('daytime1');
    const daytime2 = document.getElementById('daytime2');
    const globalScore = document.getElementById('globalScore');
    const statusBadge = document.getElementById('statusBadge');
    const logBtn = document.getElementById('logBtn');
    const historyBody = document.getElementById('historyBody');

    let historyData = [];

    function computeCurrentScore() {
      const comp1 = parseInt(c1_rating.value);
      const lat = parseFloat(latencyMin.value) || 0;
      let latScore = lat <= 15 ? 0 : lat <= 30 ? 1 : lat <= 60 ? 2 : 3;
      const comp2 = Math.min(3, Math.floor((latScore + 0) / 2));

      const hours = parseFloat(sleepHours.value) || 0;
      const comp3 = hours > 7 ? 0 : hours >= 6 ? 1 : hours >= 5 ? 2 : 3;

      const [bH, bM] = bedTime.value.split(':').map(Number);
      const [wH, wM] = wakeTime.value.split(':').map(Number);
      let inBedMinutes = (wH * 60 + wM) - (bH * 60 + bM);
      if (inBedMinutes <= 0) inBedMinutes += 24 * 60;
      const inBedHours = inBedMinutes / 60;
      const efficiency = inBedHours > 0 ? (hours / inBedHours) * 100 : 0;
      const comp4 = efficiency >= 85 ? 0 : efficiency >= 75 ? 1 : efficiency >= 65 ? 2 : 3;

      const comp5 = 0;
      const comp6 = parseInt(c6_rating.value);

      const daySum = parseInt(daytime1.value) + parseInt(daytime2.value);
      const comp7 = daySum === 0 ? 0 : daySum <= 2 ? 1 : daySum <= 4 ? 2 : 3;

      return comp1 + comp2 + comp3 + comp4 + comp5 + comp6 + comp7;
    }

    function getTier(total) {
      if (total <= 5) {
        return { label: "Good Sleeper (Score ≤ 5)", color: "var(--good)" };
      } else {
        return { label: "Poor Sleeper / Disturbance (Score > 5)", color: "var(--poor)" };
      }
    }

    function updatePSQI() {
      const total = computeCurrentScore();
      const tier = getTier(total);

      globalScore.textContent = total;
      statusBadge.textContent = tier.label;
      statusBadge.style.backgroundColor = tier.color;
    }

    function renderHistory() {
      if (historyData.length === 0) return;
      historyBody.innerHTML = historyData.map(item => `
        <tr>
          <td>#${item.sessionNumber}</td>
          <td><strong>${item.score}</strong> / 21</td>
          <td><span style="color: ${item.tier.color}; font-weight: 600;">${item.tier.label}</span></td>
        </tr>
      `).join('');
    }

    logBtn.addEventListener('click', () => {
      const score = computeCurrentScore();
      const tier = getTier(score);
      const sessionNumber = historyData.length + 1;

      historyData.unshift({ sessionNumber, score, tier });
      renderHistory();
    });

    [bedTime, wakeTime, sleepHours, latencyMin, c1_rating, c6_rating, daytime1, daytime2].forEach(el => {
      el.addEventListener('input', updatePSQI);
      el.addEventListener('change', updatePSQI);
    });

    updatePSQI();
  </script>
</body>
</html>
