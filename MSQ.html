<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSQ Interactive Visual</title>
<style>
  body {
    background: #121212;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 12px;
  }
  .card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 20px;
    max-width: 440px;
    width: 100%;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .header-tag {
    color: #8ab4f8;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .question {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 12px 0 20px 0;
    min-height: 54px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .btn {
    background: #2a2a2a;
    color: #fff;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 12px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn:hover { background: #383838; border-color: #8ab4f8; }
  .btn.active { background: #1a3a60; border-color: #8ab4f8; color: #8ab4f8; font-weight: bold; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #2d2d2d;
    padding-top: 14px;
  }
  .score-display {
    font-size: 0.85rem;
    color: #aaa;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header-tag" id="domainTag">Role-Restrictive (Q1/14)</div>
  <div class="question" id="qText">1. How often have migraines interfered with how well you dealt with family, friends and others who are close to you?</div>
  
  <div class="grid" id="optGrid"></div>

  <div class="footer">
    <button class="btn" onclick="prevQ()" id="prevBtn" style="padding: 6px 14px;">Previous</button>
    <div class="score-display" id="progressText">1 / 14</div>
    <button class="btn" onclick="nextQ()" id="nextBtn" style="padding: 6px 14px;">Next</button>
  </div>
</div>

<script>
  const questions = [
    { text: "1. How often have migraines interfered with how well you dealt with family, friends and others who are close to you?", d: "Role-Restrictive" },
    { text: "2. How often have migraines interrupted with your leisure time activities such as reading or exercising?", d: "Role-Restrictive" },
    { text: "3. How often have you had difficulty in performing work or other daily activities?", d: "Role-Restrictive" },
    { text: "4. How often have migraines kept you from getting as much accomplished as you normally do at work or at home?", d: "Role-Restrictive" },
    { text: "5. How often have migraines limited your ability to work or do other activities as carefully as you usually do them?", d: "Role-Restrictive" },
    { text: "6. How often have you had to cancel or delay work or social activities because you were exhausted?", d: "Role-Restrictive" },
    { text: "7. How often have migraines left you with limited energy levels?", d: "Role-Restrictive" },
    { text: "8. How often have you had to stop work or other activities?", d: "Role-Preventive" },
    { text: "9. How often have you needed the help of other people in handling routine tasks?", d: "Role-Preventive" },
    { text: "10. How often have you avoided social or family activities to treat your migraine attacks?", d: "Role-Preventive" },
    { text: "11. How often has it been difficult for you to go to social events such as parties?", d: "Role-Preventive" },
    { text: "12. How often have you felt fed up or frustrated?", d: "Emotional Function" },
    { text: "13. How often have you felt like you were a burden on others?", d: "Emotional Function" },
    { text: "14. How often have you been afraid of letting others down?", d: "Emotional Function" }
  ];

  const scale = ["Never", "Rarely", "Sometimes", "Pretty", "Almost", "Always"];
  let cur = 0;
  const vals = Array(14).fill(null);

  function render() {
    document.getElementById("domainTag").innerText = `${questions[cur].d} (Q${cur+1}/14)`;
    document.getElementById("qText").innerText = questions[cur].text;
    document.getElementById("progressText").innerText = `${cur + 1} / 14`;
    const g = document.getElementById("optGrid");
    g.innerHTML = "";
    scale.forEach((s, idx) => {
      const b = document.createElement("button");
      b.className = "btn" + (vals[cur] === idx + 1 ? " active" : "");
      b.innerText = s;
      b.onclick = () => { vals[cur] = idx + 1; render(); setTimeout(nextQ, 150); };
      g.appendChild(b);
    });
  }

  function nextQ() { if (cur < 13) { cur++; render(); } }
  function prevQ() { if (cur > 0) { cur--; render(); } }

  render();
</script>
</body>
</html>
