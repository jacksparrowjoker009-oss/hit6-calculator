<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinical Headache & Migraine Assessment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px 10px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    /* Clickable Tab Navigation */
    .tabs-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
      overflow-x: auto;
    }
    .tab-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    /* Page Visibility */
    .page { display: none; }
    .page.active { display: block; }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: #fff;
    }
    .subtext {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    /* Questions & Options */
    .q-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .q-title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .radio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #f8fafc;
    }
    .radio-label input {
      accent-color: #38bdf8;
      transform: scale(1.15);
    }

    /* Number & Range inputs */
    .num-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .num-input-row input[type="number"] {
      width: 70px;
      padding: 8px;
      font-size: 1rem;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      flex-shrink: 0;
    }

    /* Buttons */
    .action-row {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #334155;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-outline {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    /* Summary Table */
    .table-box {
      width: 100%;
      overflow-x: auto;
      margin-top: 14px;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      background: #111827;
      text-align: left;
    }
    th {
      background: #93c5fd;
      color: #0f172a;
      font-weight: 700;
      padding: 12px;
    }
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #1f2937;
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    .t-bold { font-weight: 700; color: #fff; }
  </style>
</head>
<body>

<div class="container">

  <div class="tabs-nav">
    <button type="button" class="tab-btn active" id="tab1" onclick="goToPage(1)">1. HIT-6™</button>
    <button type="button" class="tab-btn" id="tab2" onclick="goToPage(2)">2. MSQ (14 Items)</button>
    <button type="button" class="tab-btn" id="tab3" onclick="goToPage(3)">3. MIDAS &amp; VAS</button>
    <button type="button" class="tab-btn" id="tab4" onclick="calculateAndShowSummary()">4. Results Table</button>
  </div>

  <div class="page active" id="page1">
    <h1>HIT-6™ Headache Impact Test</h1>
    <p class="subtext">Select one answer for each question (past 4 weeks).</p>

    <div class="q-card">
      <div class="q-title">1. When you have headaches, how often is the pain severe?</div>
      <div class="radio-grid">
