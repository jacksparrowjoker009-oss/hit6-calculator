<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDAS Interactive Assessment</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
  .card { background: #1e293b; max-width: 650px; width: 100%; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  h2 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
  p.instructions { color: #94a3b8; font-size: 0.9rem; line-height: 1.4; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.92rem; margin-bottom: 6px; color: #e2e8f0; }
  input[type="number"], input[type="range"] { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
  .score-box { margin-top: 24px; padding: 16px; border-radius: 8px; background: #334155; text-align: center; }
  .score-number { font-size: 2rem; font-weight: bold; color: #38bdf8; }
  .grade-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 600; margin-top: 8px; font-size: 0.9rem; }
  .grade-1 { background: #166534; color: #bbf7d0; }
  .grade-2 { background: #854d0e; color: #fef08a; }
  .grade-3 { background: #9a3412; color: #fed7aa; }
  .grade-4 { background: #991b1b; color: #fecaca; }
</style>
</head>
<body>

<div class="card">
  <h2>Migraine Disability Assessment (MIDAS)</h2>
  <p class="instructions">Enter the number of affected days over the last 3 months (90 days):</p>

  <div class="field">
    <label>1. Days missed from work or school:</label>
    <input type="number" id="q1" min="0" max="90" value="0" oninput="calcMIDAS()">
  </div>

  <div class="field">
    <label>2. Days productivity at work/school was reduced by ≥50%:</label>
    <input type="number" id="q2" min="0" max="90" value="0" oninput="calcMIDAS()">
  </div>

  <div class="field">
    <label>3. Days household work was missed:</label>
    <input type="number" id="q3" min="0" max="90" value="0" oninput="calcMIDAS()">
  </div>

  <div class="field">
    <label>4. Days household productivity was reduced by ≥50%:</label>
    <input type="number" id="q4" min="0" max="90" value="0" oninput="calcMIDAS()">
  </div>

  <div class="field">
    <label>5. Days family, social, or leisure activities were missed:</label>
    <input type="number" id="q5" min="0" max="90" value="0" oninput="calcMIDAS()">
  </div>

  <div class="field">
    <label>A. Total headache days in past 3 months (Diagnostic Context):</label>
    <input type="number" id="qa" min="0" max="90" value="0">
  </div>

  <div class="field">
    <label>B. Average pain intensity (0–10): <span id="painVal">5</span></label>
    <input type="range" id="qb" min="0" max="10" value="5" oninput="document.getElementById('painVal').innerText = this.value">
  </div>

  <div class="score-box">
    <div>Total MIDAS Score</div>
    <div class="score-number" id="totalScore">0</div>
    <div id="gradeBadge" class="grade-badge grade-1">Grade I: Little or No Disability</div>
  </div>
</div>

<script>
function calcMIDAS() {
  const q1 = Number(document.getElementById('q1').value) || 0;
  const q2 = Number(document.getElementById('q2').value) || 0;
  const q3 = Number(document.getElementById('q3').value) || 0;
  const q4 = Number(document.getElementById('q4').value) || 0;
  const q5 = Number(document.getElementById('q5').value) || 0;

  const total = q1 + q2 + q3 + q4 + q5;
  document.getElementById('totalScore').innerText = total;

  const badge = document.getElementById('gradeBadge');
  if (total <= 5) {
    badge.className = "grade-badge grade-1";
    badge.innerText = "Grade I: Little or No Disability (0–5)";
  } else if (total <= 10) {
    badge.className = "grade-badge grade-2";
    badge.innerText = "Grade II: Mild Disability (6–10)";
  } else if (total <= 20) {
    badge.className = "grade-badge grade-3";
    badge.innerText = "Grade III: Moderate Disability (11–20)";
  } else {
    badge.className = "grade-badge grade-4";
    badge.innerText = "Grade IV: Severe Disability (21+)";
  }
}
</script>
</body>
</html>
