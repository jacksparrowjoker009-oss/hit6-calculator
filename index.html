<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinical Headache & Migraine Assessment</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --table-header-bg: #93c5fd;
      --table-header-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .main-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Step Indicators */
    .wizard-nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      gap: 6px;
    }
    .step-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .step-badge.active { color: var(--accent); }
    .step-badge.done { color: #34d399; }

    /* Page Visibility */
    .page-step { display: none; }
    .page-step.active { display: block; }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: #fff;
    }
    .instructions {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    /* HIT-6 Form Elements */
    .question-block {
      padding: 14px 0;
      border-bottom: 1px solid var(--card-border);
    }
    .question-title {
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .option-label:has(input:checked), .option-label.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #c2e7ff;
      font-weight: 600;
    }
    .option-label input { accent-color: var(--accent); }

    /* MSQ Elements */
    .msq-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .domain-tag {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 8px;
    }
    .msq-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .opt-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }
    .opt-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #c2e7ff;
      font-weight: 700;
    }

    /* MIDAS Elements */
    .midas-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
      font-size: 0.88rem;
      line-height: 1.4;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .midas-row input[type="number"] {
      width: 60px;
      padding: 8px 4px;
      font-size: 1rem;
      text-align: center;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: #fff;
      border-radius: 6px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .vas-slider-box {
      width: 100%;
    }
    .vas-slider-box input[type="range"] {
      width: 100%;
      margin: 10px 0;
      accent-color: var(--accent);
    }

    /* Navigation Buttons */
    .btn-row {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }
    .btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-sec {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

      width: 100%;
